---
- name: Install common packages
  hosts: all
  become: true
  become_method: su

  tasks:
    - name: Install common packages
      ansible.builtin.dnf:
        name:
          - htop
          - vim
          - wget
          - fastfetch

    - name: Create user jeremy
      ansible.builtin.user:
        name: jeremy

    - name: Copy SSH key to profile
      ansible.builtin.authorized_key:
        user: jeremy
        state: present
        key: "{{ lookup('file', '/Users/jeremy/.ssh/id_ed25519_sk.pub') }}"

- name: Install base packages + Prometheus config for VMs
  hosts: all:!monitoring
  become: true
  become_method: su

  roles:
    - prometheus.prometheus.node_exporter

  tasks:
    - name: Install specific packages for VMs
      ansible.builtin.dnf:
        name:
          - rsync
          - nfs-utils

    - name: Authorize port 9100 in firewall
      ansible.builtin.firewalld:
        port: 9100/tcp
        permanent: true
        state: enabled

- name: Install specific packages for storage VMs
  hosts: storage
  become: true
  become_method: su

  tasks:
    - name: Install specific packages
      ansible.builtin.dnf:
        name:
          - mdadm
