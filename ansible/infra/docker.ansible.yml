---
- name: Install Docker
  hosts: docker
  become: true
  become_method: su

  tasks:
    - name: Add Docker repository
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker Stable repository
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: yes
        state: present

    - name: Update DNF
      ansible.builtin.dnf:
        update_cache: true
        state: latest

    - name: Install Docker
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Reboot
      ansible.builtin.reboot:

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started


    - name: Create front network
      community.docker.docker_network:
        name: front
